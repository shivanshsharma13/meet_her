<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1020">
  <title>Our Little Room</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="login" class="screen" hidden>
    <div class="card login-card">
      <div class="logo">💗</div>
      <h1>Our Little Room</h1>
      <p class="muted">Just for the two of us.</p>
      <button id="signin-btn" class="btn primary">Sign in with Google</button>
      <p id="login-error" class="error" role="alert"></p>
    </div>
  </main>

  <main id="home" class="screen home" hidden>
    <header class="topbar">
      <h1 id="hello">Hi</h1>
      <button id="logout-btn" class="btn ghost small">Log out</button>
    </header>

    <section class="card partner-card">
      <div class="avatar" id="partner-initial"></div>
      <div>
        <div class="partner-name" id="partner-name"></div>
        <div class="presence"><span class="dot" id="presence-dot"></span><span id="presence-text"></span></div>
      </div>
    </section>

    <div class="actions">
      <button id="call-btn" class="btn primary big">📞 Call</button>
      <button id="nudge-btn" class="btn soft big">💭 Thinking of you</button>
    </div>

    <section>
      <h2>Our memories</h2>
      <div id="gallery" class="gallery"></div>
      <p id="gallery-empty" class="muted">Press 📸 during a call and your photo booth pictures will live here.</p>
    </section>
  </main>

  <main id="call" class="screen call" hidden>
    <video id="remote-video" autoplay playsinline></video>
    <div class="call-top">
      <span id="call-name"></span>
      <span id="call-timer"></span>
    </div>
    <div id="call-status" class="call-status"></div>
    <video id="local-video" autoplay playsinline muted class="mirror"></video>

    <div id="emoji-tray" class="emoji-tray" hidden>
      <button data-emoji="❤️">❤️</button>
      <button data-emoji="😘">😘</button>
      <button data-emoji="🥰">🥰</button>
      <button data-emoji="😂">😂</button>
      <button data-emoji="🥺">🥺</button>
      <button data-emoji="🔥">🔥</button>
      <button data-emoji="🌸">🌸</button>
    </div>

    <nav class="controls">
      <button id="mute-btn" class="ctl" aria-label="Mute microphone">🎙️</button>
      <button id="cam-btn" class="ctl" aria-label="Turn camera off">📷</button>
      <button id="flip-btn" class="ctl" aria-label="Switch camera" hidden>🔄</button>
      <button id="react-btn" class="ctl" aria-label="Send love">💗</button>
      <button id="booth-btn" class="ctl" aria-label="Photo booth">📸</button>
      <button id="hangup-btn" class="ctl hangup" aria-label="Hang up">📞</button>
    </nav>

    <div id="countdown" class="countdown" hidden></div>
    <div id="flash" class="flash"></div>
  </main>

  <div id="incoming" class="overlay" hidden>
    <div class="card incoming-card">
      <div class="avatar pulse" id="incoming-initial"></div>
      <p><strong id="incoming-name"></strong> is calling you 💗</p>
      <div class="row">
        <button id="decline-btn" class="btn danger">Decline</button>
        <button id="accept-btn" class="btn primary">Answer</button>
      </div>
    </div>
  </div>

  <div id="viewer" class="overlay" hidden>
    <figure class="viewer">
      <img id="viewer-img" alt="">
      <figcaption id="viewer-caption"></figcaption>
      <div class="row">
        <a id="viewer-download" class="btn soft" download>Download</a>
        <button id="viewer-close" class="btn ghost">Close</button>
      </div>
    </figure>
  </div>

  <div id="fx" class="fx" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
